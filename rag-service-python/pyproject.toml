[project]
name = "rag-service-python"
version = "0.1.0"
description = "Independent RAG Knowledge Service for Java backend knowledge documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
